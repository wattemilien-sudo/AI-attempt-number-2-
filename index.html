<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal School & Document AI</title>
  
  <!-- Load PDF.js and Mammoth.js for parsing PDFs and Word documents -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    
    #header { padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    #title { font-weight: bold; font-size: 1.1rem; }
    #status { font-size: 0.85rem; color: #a855f7; font-weight: bold; }
    
    #toolbar { background: #1e293b; padding: 10px 20px; border-bottom: 1px solid #334155; display: flex; gap: 10px; align-items: center; font-size: 0.9rem; }
    #file-upload { display: none; }
    .file-btn { background: #334155; color: #f8fafc; padding: 6px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #475569; font-size: 0.85rem; }
    .file-btn:hover { background: #475569; }
    #loaded-file-name { color: #4ade80; font-style: italic; font-size: 0.85rem; }

    #chat-box { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    
    .message-wrapper { display: flex; width: 100%; }
    .message-wrapper.user { justify-content: flex-end; }
    .message-wrapper.ai { justify-content: flex-start; }
    
    .message-bubble { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
    .user .message-bubble { background-color: #a855f7; color: white; border-bottom-right-radius: 2px; }
    .ai .message-bubble { background-color: #1e293b; color: #f8fafc; border-bottom-left-radius: 2px; border: 1px solid #334155; }

    .action-btn { display: inline-block; margin-top: 10px; background: #2563eb; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
    .action-btn:hover { background: #1d4ed8; }

    #chat-form { display: flex; padding: 15px 20px; background-color: #1e293b; border-top: 1px solid #334155; gap: 10px; }
    #chat-input { flex-grow: 1; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; outline: none; font-size: 0.95rem; }
    #chat-input:focus { border-color: #a855f7; }
    
    button[type="submit"] { padding: 12px 24px; background-color: #a855f7; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    button[type="submit"]:hover { background-color: #9333ea; }
    button:disabled { background-color: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="header">
    <span id="title">📄 Universal School & Document AI</span>
    <span id="status">⏳ Downloading AI Brain...</span>
  </div>

  <div id="toolbar">
    <label for="file-upload" class="file-btn">📁 Upload PDF, Word, or Text File</label>
    <input type="file" id="file-upload" accept=".txt,.pdf,.docx">
    <span id="loaded-file-name">No file loaded.</span>
  </div>

  <div id="chat-box">
    <div class="message-wrapper ai">
      <div class="message-bubble">Hello! Upload a PDF, Word (.docx), or text file above, or type a request to write an email or answer a question.</div>
    </div>
  </div>

  <form id="chat-form">
    <input type="text" id="chat-input" placeholder="Type a command or question..." disabled autocomplete="off">
    <button type="submit" id="send-btn" disabled>Send</button>
  </form>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    const statusEl = document.getElementById('status');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const fileUpload = document.getElementById('file-upload');
    const loadedFileName = document.getElementById('loaded-file-name');

    let aiPipeline = null;
    let uploadedFileContent = "";

    function addMessage(sender, text, extraHtml = "") {
      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${sender}`;
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;
      
      if (extraHtml) {
        bubble.innerHTML += "<br>" + extraHtml;
      }

      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    async function initAI() {
      try {
        aiPipeline = await pipeline('text2text-generation', 'Xenova/LaMini-Flan-T5-77M');
        statusEl.textContent = '🟢 AI Ready (Offline)';
        statusEl.style.color = '#4ade80';
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatBox.innerHTML = '';
        addMessage('ai', 'System ready! Upload a school file or type your command below.');
      } catch (err) {
        statusEl.textContent = '🔴 Failed to load AI model.';
        console.error(err);
      }
    }

    initAI();

    fileUpload.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      loadedFileName.textContent = `Reading ${file.name}...`;

      try {
        const fileExtension = file.name.split('.').pop().toLowerCase();

        if (fileExtension === 'txt') {
          const text = await file.text();
          uploadedFileContent = text;
          loadedFileName.textContent = `Loaded: ${file.name}`;
          addMessage('ai', `Successfully read text file "${file.name}".`);

        } else if (fileExtension === 'docx') {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
          uploadedFileContent = result.value;
          loadedFileName.textContent = `Loaded: ${file.name}`;
          addMessage('ai', `Successfully read Word document "${file.name}".`);

        } else if (fileExtension === 'pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
          const pdfDoc = await loadingTask.promise;
          
          let fullText = "";
          for (let i = 1; i <= pdfDoc.numPages; i++) {
            const page = await pdfDoc.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');
            fullText += `--- Page ${i} ---\n` + pageText + "\n\n";
          }

          uploadedFileContent = fullText;
          loadedFileName.textContent = `Loaded: ${file.name}`;
          addMessage('ai', `Successfully parsed PDF "${file.name}" (${pdfDoc.numPages} pages).`);
        } else {
          loadedFileName.textContent = "Unsupported file type.";
          alert("Please upload a .txt, .pdf, or .docx file.");
        }
      } catch (err) {
        console.error(err);
        loadedFileName.textContent = "Error reading file.";
        addMessage('ai', "Sorry, I had trouble reading that specific file format.");
      }
    });

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      let userText = chatInput.value.trim();
      if (!userText || !aiPipeline) return;

      // Rephrase email instructions so the tiny model doesn't output safety refusals
      let promptToSend = userText;
      const lower = userText.toLowerCase();
      if (lower.includes('email') || lower.includes('to ')) {
        promptToSend = `Write an email draft based on this request: ${userText}`;
      }

      if (uploadedFileContent) {
        promptToSend = `Context from uploaded document:\n${uploadedFileContent}\n\nUser Request: ${promptToSend}`;
      }

      addMessage('user', userText);
      chatInput.value = '';

      const loadingBubble = addMessage('ai', 'Drafting response...');

      chatInput.disabled = true;
      sendBtn.disabled = true;

      try {
        const output = await aiPipeline(promptToSend, {
          max_new_tokens: 80,
          temperature: 0.5,
          repetition_penalty: 1.5
        });

        const responseText = output[0].generated_text || "I couldn't generate a response.";
        loadingBubble.textContent = responseText;

        if (lower.includes('email') || lower.includes('to ')) {
          let recipient = "";
          if (lower.includes('angus allen')) {
            recipient = "angus.allen@whitefriars.vic.edu.au";
          } else if (lower.includes('watte')) {
            recipient = "Watte@whitefriars.vic.edu.au";
          }

          const encodedBody = encodeURIComponent(responseText);
          const mailtoLink = `<a class="action-btn" href="mailto:${recipient}?body=${encodedBody}" target="_blank">📧 Open Email to Send</a>`;
          loadingBubble.innerHTML += "<br>" + mailtoLink;
        }

      } catch (err) {
        loadingBubble.textContent = "Error processing request.";
        console.error(err);
      }

      chatInput.disabled = false;
      sendBtn.disabled = false;
      chatInput.focus();
    });
  </script>
</body>
</html>
